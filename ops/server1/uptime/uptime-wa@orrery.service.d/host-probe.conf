# /etc/systemd/system/uptime-wa@orrery.service.d/host-probe.conf
# Orrery only: before the check container starts, the host writes /opt/uptime-monitor/orrery/probe/host.json
# (container states and the indexer health on 127.0.0.1:18788, which the check container cannot reach itself).
# The leading "-" keeps a probe failure from skipping the check; the check reports a missing or stale file as FAIL.
[Service]
ExecStartPre=-/usr/bin/node /opt/uptime-monitor/orrery/host-probe.mjs /opt/uptime-monitor/orrery
