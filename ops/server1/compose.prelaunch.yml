# Before the mainnet deploy: only Postgres and the Discord process, so the server's upkeep (booster role, #boosters,
# feature rooms) runs unattended. Same project, container and volume names as compose.yml, so the full stack takes over
# without moving data:  docker compose -p orrery-mainnet --env-file release.env -f compose.prelaunch.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: orrery-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: orrery
      POSTGRES_DB: orrery
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
    volumes:
      - orrery-pg:/var/lib/postgresql/data
      - /opt/orrery/secrets/pg-password:/run/secrets/pg-password:ro
    healthcheck: {test: ["CMD", "pg_isready", "-U", "orrery", "-d", "orrery"], interval: 5s, retries: 20}
    mem_limit: 256m
    networks: [data]

  discord:
    image: orrery-services:${TAG:?set TAG, or pass --env-file release.env}
    container_name: orrery-discord
    restart: unless-stopped
    command: ["src/bin/discord.ts"]
    env_file: [common.env, discord.env]
    volumes:
      - /opt/orrery/secrets/discord-bot.txt:/run/keys/discord-bot.txt:ro
      - /opt/orrery/cards:/run/cards:ro
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 256m
    cpus: 0.25
    networks: [data]

volumes:
  orrery-pg:

networks:
  # server 1's default address pools are used up; an explicit subnet, clear of the 10.232.1/3/5 networks there
  data:
    ipam:
      config: [{subnet: 10.232.9.0/24}]
