# api.orreryagent.com on the Tridjaya host. The HTTPS block is added by host-tridjaya.ts prep once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name api.orreryagent.com;
    location /.well-known/acme-challenge/ { root /var/www/acme-temp; }
    location / { return 301 https://$host$request_uri; }
}
#HTTPS
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name api.orreryagent.com;
    ssl_certificate /etc/letsencrypt/live/api.orreryagent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orreryagent.com/privkey.pem;
    client_max_body_size 2m;
    location / { proxy_pass http://127.0.0.1:18787; include /etc/nginx/s1-proxy.inc; }
}
